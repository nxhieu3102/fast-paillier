<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fast Paillier WASM Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h2 {
            color: #333;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        input[type="number"] {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 3px solid #4CAF50;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fast Paillier WASM Test</h1>
        
        <div class="section">
            <h2>Initialization</h2>
            <button id="init-btn">Initialize Paillier</button>
            <button id="precompute-btn">Create Precomputed Table</button>
            <input type="number" id="window-size" placeholder="Window Size (e.g., 8)" value="8">
            <div id="init-result" class="result"></div>
        </div>

        <div class="section">
            <h2>Encryption/Decryption</h2>
            <div>
                <input type="number" id="plaintext" placeholder="Enter plaintext number">
                <button id="encrypt-btn">Encrypt</button>
                <button id="encrypt-precomputed-btn">Encrypt with Precomputed</button>
                <div id="encryption-result" class="result"></div>
            </div>
            <div>
                <input type="text" id="ciphertext" placeholder="Enter ciphertext" style="width: 400px;">
                <button id="decrypt-btn">Decrypt</button>
                <div id="decryption-result" class="result"></div>
            </div>
        </div>

        <div class="section">
            <h2>Homomorphic Operations</h2>
            <div>
                <input type="text" id="ciphertext1" placeholder="Ciphertext 1" style="width: 400px;">
                <input type="text" id="ciphertext2" placeholder="Ciphertext 2" style="width: 400px;">
                <button id="add-btn">Homomorphic Add</button>
                <div id="add-result" class="result"></div>
            </div>
            <div>
                <input type="text" id="ciphertext-mul" placeholder="Ciphertext" style="width: 400px;">
                <input type="number" id="scalar" placeholder="Scalar">
                <button id="mul-btn">Homomorphic Multiply</button>
                <div id="mul-result" class="result"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { PaillierWasm } from './pkg/fast_paillier.js';

        let paillier = null;

        async function initWasm() {
            try {
                await init();
                document.getElementById('init-result').textContent = 'WASM module initialized successfully!';
                // document.getElementById('init-btn').disabled = true;
            } catch (e) {
                document.getElementById('init-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        }

        window.addEventListener('load', initWasm);

        document.getElementById('init-btn').addEventListener('click', () => {
            try {
                paillier = new PaillierWasm();
                console.log(paillier);
                document.getElementById('init-result').textContent = 'Paillier initialized successfully!';
                // document.getElementById('precompute-btn').disabled = false;
            } catch (e) {
                document.getElementById('init-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('precompute-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('init-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const windowSize = parseInt(document.getElementById('window-size').value) || 8;
            
            console.log('windowSize', windowSize);
            try {
                paillier.create_precomputed_table(windowSize);
                console.log('precomputed table created');
                document.getElementById('init-result').textContent = `Precomputed table created with window size ${windowSize}!`;
            } catch (e) {
                document.getElementById('init-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('encrypt-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('encryption-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const plaintext = document.getElementById('plaintext').value;
            
            try {
                const ciphertext = paillier.encrypt(plaintext);
                document.getElementById('encryption-result').textContent = `Encrypted: ${ciphertext}`;
                document.getElementById('ciphertext').value = ciphertext;
            } catch (e) {
                document.getElementById('encryption-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('encrypt-precomputed-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('encryption-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const plaintext = parseInt(document.getElementById('plaintext').value);
            
            try {
                const ciphertext = paillier.encrypt_with_precomputed(plaintext);
                document.getElementById('encryption-result').textContent = `Encrypted (precomputed): ${ciphertext}`;
                document.getElementById('ciphertext').value = ciphertext;
            } catch (e) {
                document.getElementById('encryption-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('decrypt-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('decryption-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const ciphertext = document.getElementById('ciphertext').value;
            
            try {
                const plaintext = paillier.decrypt(ciphertext);
                document.getElementById('decryption-result').textContent = `Decrypted: ${plaintext}`;
            } catch (e) {
                document.getElementById('decryption-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('add-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('add-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const ciphertext1 = document.getElementById('ciphertext1').value;
            const ciphertext2 = document.getElementById('ciphertext2').value;
            
            try {
                const result = paillier.homomorphic_add(ciphertext1, ciphertext2);
                document.getElementById('add-result').textContent = `Result: ${result}`;
            } catch (e) {
                document.getElementById('add-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });

        document.getElementById('mul-btn').addEventListener('click', () => {
            if (!paillier) {
                document.getElementById('mul-result').innerHTML = '<span class="error">Please initialize Paillier first!</span>';
                return;
            }

            const ciphertext = document.getElementById('ciphertext-mul').value;
            const scalar = parseInt(document.getElementById('scalar').value);
            
            try {
                const result = paillier.homomorphic_mul(ciphertext, scalar);
                document.getElementById('mul-result').textContent = `Result: ${result}`;
            } catch (e) {
                document.getElementById('mul-result').innerHTML = `<span class="error">Error: ${e.message}</span>`;
            }
        });
    </script>
</body>
</html>
