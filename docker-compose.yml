version: '3'

services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast_paillier_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - redis_network

networks:
  redis_network:
    driver: bridge

volumes:
  redis_data:
    driver: local 
