[package]
name = "fast-paillier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Optimized Paillier encryption scheme"
repository = "https://github.com/dfns/fast-paillier"
categories = ["algorithms", "cryptography"]
keywords = ["paillier", "public-key", "encryption"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rug = { version = "1.27", default-features = false, features = [
    "std",
    "integer",
    "rand",
    "serde",
] }
rand_core = "0.6"
bytemuck = { version = "1.5", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
redis = { version = "0.23.0", features = ["tokio-comp"], optional = true }
bincode = { version = "1.3.3", optional = true }
sha2 = { version = "0.10.6", optional = true }
hex = { version = "0.4.3", optional = true }

[dev-dependencies]
rand = "0.8"
rand_dev = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
libpaillier = { version = "0.5", default-features = false, features = ["gmp"] }
once_cell = "1.21.3"
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

[features]
default = ["dep:bincode", "dep:redis"]
serde = ["dep:serde", "rug/serde", "dep:serde_json"]
redis-cache = ["dep:redis", "dep:bincode", "dep:sha2", "dep:hex", "serde"]

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "encryption_precompute"
harness = false

[[bench]]
name = "encryption"
harness = false

[[example]]
name = "redis_cache_example"
required-features = ["redis-cache"]
