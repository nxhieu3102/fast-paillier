[package]
name = "fast-paillier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Optimized Paillier encryption scheme"
repository = "https://github.com/dfns/fast-paillier"
categories = ["algorithms", "cryptography"]
keywords = ["paillier", "public-key", "encryption"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand_core = "0.6"
bytemuck = { version = "1.5", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
malachite = {path = "../fork-malachite/malachite" }
malachite-base = {path = "../fork-malachite/malachite-base", features = ["random"] }
malachite-bigint = {path = "../fork-malachite/malachite-bigint" }
malachite-nz = {path = "../fork-malachite/malachite-nz", features = ["random"] }
wasm-bindgen = "0.2"

[dev-dependencies]
rand = "0.8"
rand_dev = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
once_cell = "1.21.3"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[[bench]]
name = "comparison"
harness = false


[[bench]]
name = "keygen"
harness = false

[[bench]]
name = "precompute_table"
harness = false

[lib]
crate-type = ["rlib", "cdylib"]
wasm-bindgen = "0.2"
